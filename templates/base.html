<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Notenrechner{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('notenliste') }}">Notenrechner</a>
      <nav>
        <a href="{{ url_for('notenliste') }}">Notenliste</a>
        <a href="{{ url_for('erfassen') }}">Erfassen</a>
        <a href="{{ url_for('semester') }}">Semester</a>
        <a href="{{ url_for('ranking') }}">Ranking</a>
        <a href="{{ url_for('ziel') }}">Note für 4.0</a>
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
