{% extends "base.html" %}
{% block title %}Note erfassen{% endblock %}
{% block content %}
  <h1>Note erfassen</h1>
  {% if fehler %}
    <ul class="fehler">
      {% for meldung in fehler %}
        <li>{{ meldung }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  <form method="post">
    <label>
      Fach
      <input name="fach" list="faecher" value="{{ werte.get('fach', '') }}" required>
      <datalist id="faecher">
        {% for fach in faecher %}
          <option value="{{ fach }}"></option>
        {% endfor %}
      </datalist>
    </label>
    <label>
      Prüfung
      <input name="pruefung" value="{{ werte.get('pruefung', '') }}" required>
    </label>
    <label>
      Note
      <input name="note" type="number" min="1" max="6" step="0.1" value="{{ werte.get('note', '') }}" required>
    </label>
    <label>
      Gewicht
      <input name="gewicht" type="number" min="0.5" step="0.5" value="{{ werte.get('gewicht', 1) }}" required>
    </label>
    <label>
      Semester
      <input name="semester" type="number" min="1" value="{{ werte.get('semester', 1) }}" required>
    </label>
    <label>
      Datum
      <input name="datum" type="date" value="{{ werte.get('datum', '') }}" required>
    </label>
    <button type="submit">Speichern</button>
  </form>
{% endblock %}
