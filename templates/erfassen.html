{% extends "base.html" %}
{% block title %}Note erfassen{% endblock %}
{% block content %}
  <h1>Note erfassen</h1>
  <form method="post">
    <label>
      Fach
      <input name="fach" list="faecher" required>
      <datalist id="faecher">
        {% for fach in faecher %}
          <option value="{{ fach }}"></option>
        {% endfor %}
      </datalist>
    </label>
    <label>
      Prüfung
      <input name="pruefung" required>
    </label>
    <label>
      Note
      <input name="note" type="number" min="1" max="6" step="0.1" required>
    </label>
    <label>
      Gewicht
      <input name="gewicht" type="number" min="0" step="0.5" value="1" required>
    </label>
    <label>
      Semester
      <input name="semester" type="number" min="1" value="1" required>
    </label>
    <label>
      Datum
      <input name="datum" type="date" required>
    </label>
    <button type="submit">Speichern</button>
  </form>
{% endblock %}
